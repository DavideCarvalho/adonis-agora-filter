# domain_map.yaml
# Generated by skill-domain-discovery (autonomous mode — no maintainer interview;
# fully grounded in README, docs/**, and packages/*/src)
# Library: adonis-filter (monorepo)
# Version: @adonis-agora/filter@0.7.0 / @adonis-agora/filter-client@0.2.1
# Date: 2026-07-21
# Status: reviewed

library:
  name: 'adonis-filter'
  version: '0.7.0'
  repository: 'https://github.com/DavideCarvalho/adonis-agora-filter'
  description: >-
    Server-side query filtering/sorting/pagination for AdonisJS (Spatie/JSON:API
    style, Lucid adapter, field allow-listing) plus a framework-agnostic client
    query builder with optional TanStack Table sync.
  primary_framework: 'AdonisJS'

domains:
  - name: 'Wiring a filtered endpoint'
    slug: 'endpoint-wiring'
    description: >-
      Parse a request, apply it to a Lucid query under an allow-list, resolve
      pagination — the two-function primitive and the declarative defineFilter flow.
  - name: 'Guarding the query surface'
    slug: 'query-safety'
    description: >-
      Allow-listing, structural validation, strict vs lenient rejection, tenant
      scoping, injection escapes, and testing the boundary.
  - name: 'Declaring filter policies'
    slug: 'policy-declaration'
    description: >-
      defineFilter specs — relations with depth caps, aliases, computed/virtual
      fields, to-many aggregates, field types and coercion, server-side defaults.
  - name: 'Paging, searching, projecting'
    slug: 'paging-search-projection'
    description: >-
      Offset and cursor pagination, ILIKE / tsvector / pgvector search modes,
      DISTINCT projection, richer Spatie request shapes and input sourcing.
  - name: 'Sharing the contract with clients'
    slug: 'client-contract'
    description: >-
      Codegen from a spec into a typed client builder, and hand-building typed
      query strings in the browser.

skills:
  - name: 'Filter basics'
    slug: 'filter-basics'
    domain: 'endpoint-wiring'
    description: 'Install, parse a request, apply it to a Lucid query under an allow-list, paginate; the declarative defineFilter flow and optional macros.'
    type: 'core'
    packages:
      - '@adonis-agora/filter'
    covers:
      - 'parseFilterRequest'
      - 'applyFilter'
      - 'FilterConfig (allowed/sortable/searchable/defaultSize/maxSize)'
      - 'defineFilter'
      - 'applyFilterFromRequest'
      - 'provider macros (.applyFilterFromRequest() / .filterPaginate())'
      - 'resolved pagination return value'
    tasks:
      - 'Add filtering to an AdonisJS list endpoint'
      - 'Reuse one filter policy across controllers'
      - 'Wire the optional Lucid macros'
    failure_modes:
      - mistake: 'Using raw request page/size instead of resolved values'
        mechanism: 'applyFilter clamps size to [1, maxSize] (cap default 100) and floors page to 1; feeding request values straight to paginate() skips the clamp, so size=50000 executes.'
        wrong_pattern: |
          const input = parseFilterRequest(request.qs())
          await User.query().paginate(input.page ?? 1, input.size ?? 25)
        correct_pattern: |
          const input = parseFilterRequest(request.qs())
          const query = User.query()
          const { page, size } = applyFilter(query, input, { allowed: ['name'], maxSize: 100 })
          return query.paginate(page, size)
        source: 'DavideCarvalho/adonis-filter:docs/getting-started.mdx ("Why pagination is returned, not applied"); docs/guides/filter-classes.mdx (Pagination bounds)'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['filter-basics']
      - mistake: 'Adding tenant-scoped columns to the allow-list'
        mechanism: 'The tenant scope always lands as trusted policy; if the column is also filterable, a client filter on it AND-combines with the server scope, producing silently empty result sets.'
        wrong_pattern: |
          export const userFilter = defineFilter({
            filterable: ['name', 'tenantId'], // client can now constrain tenantId
            tenant: { column: 'tenantId', resolve: (ctx) => ctx.tenantId },
          })
        correct_pattern: |
          export const userFilter = defineFilter({
            filterable: ['name'],
            tenant: { column: 'tenantId', resolve: (ctx) => ctx.tenantId },
          })
        source: 'DavideCarvalho/adonis-filter:docs/definitions/index.mdx ("Tenant scope is un-tamperable"); docs/guides/controllers.mdx (forced constraints before applyFilter)'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-basics']
      - mistake: 'Expecting search to work without a searchable list'
        mechanism: 'The free-text search term is only applied when searchable is non-empty; otherwise it is silently skipped and the endpoint returns unfiltered-by-search rows.'
        wrong_pattern: |
          applyFilter(query, input, { allowed: ['name'] })
          // ?search=fleet is ignored — no searchable columns declared
        correct_pattern: |
          applyFilter(query, input, {
            allowed: ['name'],
            searchable: ['name', 'email'],
          })
        source: 'DavideCarvalho/adonis-filter:docs/guides/filter-classes.mdx ("searchable enables free-text search")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-basics']
    compositions:
      - library: '@adonisjs/lucid'
        skill: ''

  - name: 'Filter safety'
    slug: 'filter-safety'
    domain: 'query-safety'
    description: 'Allow-list as the security boundary, throwOnInvalid strict mode, structural validation, tenant scoping, LIKE escaping, VineJS layering, and unit-testing with the shipped mock.'
    type: 'core'
    packages:
      - '@adonis-agora/filter'
    covers:
      - 'allowed / sortable / searchable allow-lists'
      - 'throwOnInvalid + InvalidColumnFilterError'
      - 'validateColumnFilters, MAX_FILTER_DEPTH'
      - 'escapeLike'
      - 'fieldTypes value coercion'
      - 'applyColumnFilters trust boundary'
      - '@adonis-agora/filter/testing MockQueryBuilder'
    tasks:
      - 'Expose an endpoint to untrusted clients'
      - 'Return 400 instead of silently dropping bad fields'
      - 'Unit-test allow-listing without a database'
    failure_modes:
      - mistake: 'Allowing every column with a star allow-list'
        mechanism: 'allowed: "*" disables the filter allow-list, so any base column — passwordHash, internal flags — becomes probeable through filter values and result counts.'
        wrong_pattern: |
          applyFilter(query, input, { allowed: '*' })
        correct_pattern: |
          applyFilter(query, input, {
            allowed: ['name', 'email', 'status'],
            sortable: ['name', 'createdAt'],
          })
        source: 'DavideCarvalho/adonis-filter:docs/guides/filter-classes.mdx ("The allow-list is the security boundary" warning)'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['filter-safety']
      - mistake: 'Feeding client filters to low-level apply functions unpruned'
        mechanism: 'applyColumnFilters/applySort/applySearch trust their input and enforce no allow-list; client-derived filters handed to them inside a whereHas callback can reference arbitrary columns.'
        wrong_pattern: |
          const raw = parseFilterRequest(request.qs())
          query.whereHas('posts', (p) => applyColumnFilters(p, raw.filters ?? []))
        correct_pattern: |
          const raw = parseFilterRequest(request.qs())
          // prune against the parent policy first…
          const scratch = User.query()
          applyFilter(scratch, raw, { allowed: ['posts.title'] })
          query.whereHas('posts', (p) =>
            applyColumnFilters(p, [{ field: 'title', operator: 'equals', value: 'Hi' }]),
          )
        source: 'DavideCarvalho/adonis-filter:docs/guides/lucid.mdx (low-level functions warning); docs/guides/relations.mdx'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['filter-safety']
      - mistake: 'Trusting silent-drop while debugging a broken filter'
        mechanism: 'By default disallowed fields are dropped with no error, so a typo like sort=-craetedAt just stops doing anything; throwOnInvalid turns it into InvalidColumnFilterError.'
        wrong_pattern: |
          applyFilter(query, input, { allowed: ['name'] }) // ?sort=-craetedAt is a no-op
        correct_pattern: |
          try {
            const { page, size } = applyFilter(query, input, {
              allowed: ['name'],
              throwOnInvalid: true,
            })
          } catch (err) {
            if (err instanceof InvalidColumnFilterError) return response.badRequest({ message: err.message })
            throw err
          }
        source: 'DavideCarvalho/adonis-filter:docs/guides/validation.mdx (throwOnInvalid — allow-list rejection)'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-safety']
      - mistake: 'Assuming query-string numbers arrive as numbers'
        mechanism: 'Every query-string value parses as a string; Postgres implicit casts hide it until an uncastable value (isRecurring=xyz) raises invalid input syntax at the database — a 500 driven by user input.'
        wrong_pattern: |
          // ?filter[isRecurring]=xyz → 500 invalid input syntax for type boolean
          applyFilter(query, input, { allowed: ['isRecurring'] })
        correct_pattern: |
          applyFilter(query, input, {
            allowed: ['isRecurring'],
            fieldTypes: { isRecurring: { kind: 'boolean' } }, // rejected up front → drop or 400
          })
        source: 'DavideCarvalho/adonis-filter:docs/definitions/index.mdx (Field types & value coercion); docs/guides/operators.mdx (wire format warning)'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-safety', 'filter-definitions']
      - mistake: 'Building LIKE patterns without escaping wildcards'
        mechanism: 'User input containing % or _ widens a hand-written ILIKE pattern beyond intent; the library escapes via escapeLike(), but raw patterns built outside the adapter do not.'
        wrong_pattern: |
          qb.whereILike('name', `%${userInput}%`) // userInput '%%' matches everything
        correct_pattern: |
          import { escapeLike } from '@adonis-agora/filter'
          qb.whereILike('name', `%${escapeLike(userInput)}%`)
        source: 'DavideCarvalho/adonis-filter:docs/guides/operators.mdx (Security — LIKE escaping)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-safety']

  - name: 'Filter definitions'
    slug: 'filter-definitions'
    domain: 'policy-declaration'
    description: 'Declarative FilterSpec surfaces — relation whitelists with depth caps, field aliases, computed/virtual SQL fields, to-many aggregates, colocated field-type maps, tenant scope and server defaults.'
    type: 'core'
    packages:
      - '@adonis-agora/filter'
    covers:
      - 'defineFilter options (filterable map form, fieldTypes, maxDepth, aliases, computed, model, table)'
      - 'relation whitelists → whereHas translation'
      - 'computed string/function forms'
      - 'aggregates grammar ($count/$sum/$avg/$min/$max)'
      - 'resolveFieldAlias / remap*Aliases'
      - 'defaultFilters / defaultSort / tenant'
    tasks:
      - 'Whitelist filtering on relation columns'
      - 'Expose a virtual/computed column as filterable'
      - 'Filter or sort by a to-many aggregate'
      - 'Rename public field names without migrating clients'
    failure_modes:
      - mistake: 'Declaring aggregate paths without the owning model'
        mechanism: 'Aggregates activate only when the spec can introspect relation metadata via model; without it posts.$count etc. are simply not fields and requests referencing them are pruned.'
        wrong_pattern: |
          defineFilter({
            filterable: ['status'],
            relations: { posts: { filterable: ['title'], aggregates: ['views'] } },
          }) // posts.$count does not exist — no `model`
        correct_pattern: |
          defineFilter({
            filterable: ['status'],
            model: User,
            relations: { posts: { filterable: ['title'], aggregates: ['views'] } },
          })
        source: 'DavideCarvalho/adonis-filter:docs/definitions/aggregates.mdx ("Unlocking aggregates — the model option")'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-definitions']
      - mistake: 'Function-form computed fields without a root table'
        mechanism: 'Correlated-subquery sources splice spec.table as the outer alias; with neither table nor model set the alias resolves to an empty string and the SQL is malformed.'
        wrong_pattern: |
          defineFilter({
            filterable: ['status'],
            computed: { postCount: ({ alias }) => `(SELECT COUNT(*) FROM posts WHERE posts.author_id = ${alias}.id)` },
          })
        correct_pattern: |
          defineFilter({
            filterable: ['status'],
            model: User, // supplies table: 'users'
            computed: { postCount: ({ alias }) => `(SELECT COUNT(*) FROM posts WHERE posts.author_id = ${alias}.id)` },
          })
        source: 'DavideCarvalho/adonis-filter:docs/definitions/computed.mdx ("table is required for the function form")'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-definitions']
      - mistake: 'Reading a dotted alias target as a JSON path'
        mechanism: 'In an alias target everything before the last dot is a relation hop compiled to whereHas; metadata.tier looks for a relation named metadata and fails at the database, it never reads JSON contents.'
        wrong_pattern: |
          defineFilter({
            filterable: ['status'],
            aliases: { tier: 'metadata.tier' }, // → whereHas('metadata') — no such relation
          })
        correct_pattern: |
          defineFilter({
            filterable: ['status'],
            computed: { tier: "metadata->>'tier'" }, // real JSON access needs computed SQL
          })
        source: 'DavideCarvalho/adonis-filter:docs/definitions/aliases.mdx ("A dot in the target means a relation, not a JSON path")'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-definitions']
      - mistake: 'Nesting computed aliases inside AND/OR groups'
        mechanism: 'Computed filtering is recognized only on top-level leaf filters; inside a group the alias is treated as a normal column and dropped unless it is also a real column.'
        wrong_pattern: |
          // filter[OR][0][postCount][gte]=5 — postCount vanishes inside the group
        correct_pattern: |
          // keep computed conditions top-level: filter[postCount][gte]=5
        source: 'DavideCarvalho/adonis-filter:docs/definitions/computed.mdx ("How a computed filter is routed")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-definitions']
      - mistake: 'Chaining aliases expecting multi-hop resolution'
        mechanism: 'Alias resolution runs exactly one hop and never re-resolves the target, so {a: b, b: c} maps a to b, not c — cycles are impossible by construction.'
        wrong_pattern: |
          resolveFieldAlias({ a: 'b', b: 'c' }, 'a') // expect 'c' — actually 'b'
        correct_pattern: |
          resolveFieldAlias({ a: 'b', b: 'c' }, 'b') // → 'c'; point a directly at c instead
        source: 'DavideCarvalho/adonis-filter:docs/definitions/aliases.mdx ("No cascading, no cycles")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-definitions']
      - mistake: 'Expecting date-coerced values back as Date objects'
        mechanism: 'A date kind validates ISO syntax but hands the string back verbatim — the driver parses it; re-zoning would shift days for negative-offset clients.'
        wrong_pattern: |
          // fieldTypes: { bornOn: { kind: 'date' } } then expecting value instanceof Date
        correct_pattern: |
          // the bound value remains '2026-07-15'; let the driver parse ISO strings
        source: 'DavideCarvalho/adonis-filter:docs/definitions/index.mdx (Field types & value coercion — coercion rules)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-definitions']

  - name: 'Structured querying'
    slug: 'filter-querying'
    domain: 'paging-search-projection'
    description: 'Keyset/cursor pagination with opaque cursors, the three search modes (ILIKE, Postgres full-text, pgvector similarity), DISTINCT projections, and the richer Spatie input surface.'
    type: 'core'
    packages:
      - '@adonis-agora/filter'
    covers:
      - 'applyCursor / applyCursorFromRequest / buildCursorPage / buildKeyset'
      - 'encodeCursor / decodeCursor'
      - 'searchable ILIKE vs fullText (websearch_to_tsquery, ts_rank)'
      - 'vectorSimilarity (cosine/l2/innerProduct, threshold, topK)'
      - 'distinct projection rules'
      - 'parseSpatieRequest, resolveInputFromRequest, normalizeInput'
    tasks:
      - 'Serve stable deep pages with cursor pagination'
      - 'Route search through tsvector or rank by embeddings'
      - 'Populate a filter dropdown via distinct'
      - 'Accept filters in a POST body'
    failure_modes:
      - mistake: 'Passing model instances to buildCursorPage'
        mechanism: 'buildCursorPage reads keyset values off plain objects by field name; unserialized model instances lack those plain keys, so boundary cursors encode garbage and pages break.'
        wrong_pattern: |
          const rows = await query.exec()
          const page = buildCursorPage(rows, resolved) // Lucid model instances
        correct_pattern: |
          const rows = await query.exec()
          const page = buildCursorPage(rows.map((r) => r.serialize()), resolved)
        source: 'DavideCarvalho/adonis-filter:docs/pagination/index.mdx ("Feed buildCursorPage plain rows")'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-querying']
      - mistake: 'Projecting distinct on a relation path'
        mechanism: 'Relation filtering compiles to EXISTS subqueries, so the relation is never joined; distinct=posts.title emits a missing-FROM error at the database and the field is dropped regardless of allow-listing.'
        wrong_pattern: |
          applyFilter(User.query(), input, { allowed: ['status', 'posts.title'] })
          // ?distinct=posts.title → dropped / InvalidColumnFilterError under throwOnInvalid
        correct_pattern: |
          applyFilter(User.query(), input, { allowed: ['status', 'posts.title'] })
          // distinct only ever names root-table columns: ?distinct=status
        source: 'DavideCarvalho/adonis-filter:docs/guides/lucid.mdx ("distinct takes root-table columns only")'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-querying']
      - mistake: 'Expecting include and select to be applied'
        mechanism: 'include/select are parsed but deliberately never applied by any runner — eager-loading and sparse fieldsets stay your validated preload/select calls, so skipping them silently omits relations from responses.'
        wrong_pattern: |
          const input = parseSpatieRequest(request.qs())
          applyFilter(query, input, { allowed: ['name'] })
          return query.paginate(1, 25) // ?include=posts ignored — posts never loaded
        correct_pattern: |
          const input = parseSpatieRequest(request.qs())
          applyFilter(query, input, { allowed: ['name'] })
          for (const relation of input.include ?? []) {
            if (PRELOADABLE.includes(relation)) query.preload(relation as any)
          }
          return query.paginate(1, 25)
        source: 'DavideCarvalho/adonis-filter:docs/guides/client.mdx ("include is a request, not an action"); docs/definitions/request-input.mdx'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-querying', 'filter-query-builder']
      - mistake: 'Confusing full-text search with vector similarity'
        mechanism: 'fullText matches keywords against a tsvector document; vectorSimilarity ranks by embedding distance — configuring one while sending the other input yields silently wrong search semantics.'
        wrong_pattern: |
          defineFilter({ fullText: { column: 'embedding' } }) // tsvector @@ against a vector column
        correct_pattern: |
          defineFilter({
            vectorSimilarity: { column: 'embedding', metric: 'cosine' }, // embeddings
            // fullText: { column: 'search_vector' },                   // keywords
          })
        source: 'DavideCarvalho/adonis-filter:docs/search/index.mdx ("Full-text search ≠ vector similarity")'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-querying']
      - mistake: 'Counting on distinct paginated totals'
        mechanism: 'Lucid count leg rebuilds the SELECT, so paginate() reports the un-deduped total while the page itself is deduped; totals must come from your own countDistinct.'
        wrong_pattern: |
          const result = await query.distinct('status').paginate(page, size)
          result.totalCount // counts un-deduped rows
        correct_pattern: |
          // run your own countDistinct when the total has to match the deduped page
        source: 'DavideCarvalho/adonis-filter:docs/guides/lucid.mdx (distinct + paginate total callout)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-querying']
      - mistake: 'Wrapping text columns in to_tsvector on large tables'
        mechanism: 'Query-time to_tsvector cannot use an index and re-tokenizes every row; large tables need a stored, GIN-indexed tsvector column.'
        wrong_pattern: |
          fullText: { column: ['title', 'body'], columnKind: 'text' } // seq-scan every row
        correct_pattern: |
          fullText: { column: 'search_vector', columnKind: 'tsvector' } // GIN-indexed
        source: 'DavideCarvalho/adonis-filter:docs/search/full-text.mdx (text-columns warning)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-querying']

  - name: 'Client codegen'
    slug: 'filter-codegen'
    domain: 'client-contract'
    description: 'Generate a typed @adonis-agora/filter-client builder from a defineFilter spec — generateFilterClient pure transform and the make:filter-client ace command.'
    type: 'core'
    packages:
      - '@adonis-agora/filter'
    covers:
      - 'generateFilterClient / generateFilterClients'
      - 'make:filter-client ace command + FilterClientManifest'
      - 'fieldTypes (kind/enumValues/typeRef/nullable) → operator narrowing'
      - 'filterableFieldPaths / sortableFieldPaths'
      - 'adonisrc commands barrel registration'
    tasks:
      - 'Share one field allow-list between browser and server'
      - 'Regenerate clients after a spec change'
      - 'Emit enum-aware operator narrowing'
    failure_modes:
      - mistake: 'Running make:filter-client with the commands barrel unregistered'
        mechanism: 'Ace only sees commands an app opts into; without () => import("@adonis-agora/filter/commands") in adonisrc.ts the command fails with "command not found", reading as if it does not exist.'
        wrong_pattern: |
          // adonisrc.ts — commands array without the filter barrel
          { commands: [] }
        correct_pattern: |
          { commands: [..., () => import('@adonis-agora/filter/commands')] }
        source: 'DavideCarvalho/adonis-filter:docs/codegen/index.mdx (Step 1 callout)'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-codegen']
      - mistake: 'Hand-editing or not regenerating generated clients'
        mechanism: 'Generated modules carry a DO NOT EDIT banner and are a pure function of the spec; after a spec change a stale client keeps sending fields the server now drops — filters silently stop applying.'
        wrong_pattern: |
          // edited people_filter_client.ts by hand after renaming a spec field
        correct_pattern: |
          node ace make:filter-client # regenerate after every spec change
        source: 'DavideCarvalho/adonis-filter:docs/codegen/index.mdx (banner option, Step 4)'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-codegen']
      - mistake: 'Relying on codegen unions from a star allow-list'
        mechanism: 'A "*" filterable list cannot be enumerated, so the emitter falls back to a permissive string field union — the generated client looks typed but checks nothing.'
        wrong_pattern: |
          defineFilter({ filterable: ['*'] }) // → PeopleFilterFields = string
        correct_pattern: |
          defineFilter({ filterable: ['age', 'name', 'status'] }) // enumerable union
        source: 'DavideCarvalho/adonis-filter:docs/codegen/index.mdx (filterableFieldPaths callout)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-codegen']
      - mistake: 'Skipping fieldTypes and expecting operator narrowing'
        mechanism: 'Without a field-type map the client is field-name-safe only — operators stay permissive, so gte on a string field compiles and is only rejected (or coerced) server-side.'
        wrong_pattern: |
          generateFilterClient(spec, { name: 'people' }) // no fieldTypes
          peopleFilterQuery().gte('name', 5) // compiles — narrowing never engaged
        correct_pattern: |
          generateFilterClient(spec, {
            name: 'people',
            fieldTypes: { age: { kind: 'number' }, status: { enumValues: ['active', 'inactive'] } },
          })
        source: 'DavideCarvalho/adonis-filter:docs/codegen/index.mdx ("fieldTypes — unlock operator narrowing")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-codegen']

  - name: 'Client query builder'
    slug: 'filter-query-builder'
    domain: 'client-contract'
    description: 'Build the exact wire format the server parses — filterQuery() chaining, or()/and() groups, output formats, the typed filterQueryTyped builder, reactivity, and TanStack Table state sync.'
    type: 'core'
    packages:
      - '@adonis-agora/filter-client'
    covers:
      - 'filterQuery() where overloads / convenience methods'
      - 'where replaces vs add accumulates'
      - '.or() / .and() groups'
      - 'toQueryString / build / toFlatObject'
      - 'filterQueryTyped<Fields, FieldTypes>'
      - 'whereDynamic / sortDynamic'
      - 'subscribe / getSnapshot / getVersion'
      - 'applyTanstackTableState / tanstackTableToFilterQuery'
    tasks:
      - 'Build a filter query string in the browser'
      - 'Type-check fields and operators at compile time'
      - 'Sync TanStack Table state into a filter request'
    failure_modes:
      - mistake: 'Stacking range methods that overwrite each other'
        mechanism: 'Convenience methods delegate to where(), which REPLACES any existing filter for the same field — gte followed by lte keeps only the lte bound; ranges need between or the accumulating add().'
        wrong_pattern: |
          filterQuery().gte('age', 18).lte('age', 65) // only lte survives
        correct_pattern: |
          filterQuery().between('age', 18, 65)
          // or accumulate: .addGte('age', 18).addLte('age', 65)
        source: 'DavideCarvalho/adonis-filter:docs/guides/client.mdx ("where replaces… add accumulates")'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-query-builder']
      - mistake: 'Sending the zero-based client page straight to the server'
        mechanism: 'The builder .page() index is 0-based (TanStack convention) while applyFilter/Lucid paginate resolve a 1-based page — passing client page n through serves the wrong page silently.'
        wrong_pattern: |
          filterQuery().page(table.getState().pagination.pageIndex, 25).toQueryString()
          // server: page = max(1, 1) — TanStack page 1 renders Lucid page 1 again
        correct_pattern: |
          // normalize at the boundary: serverPage = pageIndex + 1
        source: 'DavideCarvalho/adonis-filter:docs/guides/client.mdx (0-based vs 1-based warning); docs/guides/filter-classes.mdx ("Lucid pagination is 1-based")'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-query-builder', 'filter-basics']
      - mistake: 'Treating whereDynamic as a security control'
        mechanism: 'whereDynamic/sortDynamic only bypass the client compile-time union; the server allow-list still drops or rejects any non-whitelisted field, so client typing is never the boundary.'
        wrong_pattern: |
          // assuming fields are safe because the builder accepted whereDynamic(...)
        correct_pattern: |
          // mirror the server allow-list: pass `fields` / keep applyFilter allowed authoritative
        source: 'DavideCarvalho/adonis-filter:docs/guides/client.mdx ("The server allow-list is still the real boundary")'
        priority: 'HIGH'
        status: 'active'
        skills: ['filter-query-builder', 'filter-safety']
      - mistake: 'Asserting the decoded bracket notation in tests'
        mechanism: 'toQueryString() percent-encodes field-name brackets (filter%5Bage%5D) while leaving operator brackets literal; both decode identically, but a literal-string assertion fails.'
        wrong_pattern: |
          assert.equal(qs, 'filter[age][gte]=18&sort=-createdAt')
        correct_pattern: |
          assert.equal(qs, 'filter%5Bage%5D[gte]=18&sort=-createdAt')
          // or compare decodeURIComponent(qs)
        source: 'DavideCarvalho/adonis-filter:docs/guides/client.mdx ("Why the output has %5B in it")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-query-builder']
      - mistake: 'Losing AND/OR groups through toFlatObject'
        mechanism: 'Groups are not representable as a flat object, so toFlatObject() ignores them; a query string built from a grouped builder falls back to indexed where[i] notation instead.'
        wrong_pattern: |
          filterQuery().equals('a', 1).or((q) => q.contains('n', 'x')).toFlatObject() // group gone
        correct_pattern: |
          filterQuery().equals('a', 1).or((q) => q.contains('n', 'x')).toQueryString()
        source: 'DavideCarvalho/adonis-filter:docs/guides/client.mdx (AND/OR groups callout)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-query-builder']
      - mistake: 'Mutating the cached reactive snapshot'
        mechanism: 'getSnapshot() returns the same object reference until the next mutation (required by useSyncExternalStore); mutating it corrupts the cache instead of re-rendering.'
        wrong_pattern: |
          const snap = builder.getSnapshot()
          snap.filter.where.push(myFilter) // poisons the cached snapshot
        correct_pattern: |
          builder.gte('age', 18) // mutate through the builder — it bumps version + notifies
        source: 'DavideCarvalho/adonis-filter:docs/guides/client.mdx (Reactivity callout)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['filter-query-builder']

tensions:
  - name: 'Lenient UX vs contract strictness'
    skills: ['filter-basics', 'filter-safety']
    description: 'Silent drop keeps tolerant UIs working, but hides typos and contract drift; throwOnInvalid surfaces them yet rejects queries a lenient client expected to degrade.'
    implication: 'Agents ship endpoints with default silent-drop, then debug "broken" filters that were actually being pruned; or flip throwOnInvalid on without mapping InvalidColumnFilterError to a 400.'

  - name: 'Virtual-field expressiveness vs query cost'
    skills: ['filter-definitions', 'filter-querying']
    description: 'Computed fields and to-many aggregates expose rich filter/sort surfaces, but each is a correlated subquery evaluated per row — sorting large tables by them is expensive.'
    implication: 'Agents happily make aggregate aliases sortable on big tables without indexing child FKs or considering a materialised counter column for hot paths.'

  - name: 'Client type-safety vs server authority'
    skills: ['filter-query-builder', 'filter-safety']
    description: 'The typed builder and codegen unions feel like guarantees, but only the server allow-list decides what a request may touch; dynamic escape hatches widen the client surface arbitrarily.'
    implication: 'Agents treat a compile-checked client as authorization and skip mirroring the server allow-list (e.g. the tanstack adapter fields option), letting dropped-field bugs ship silently.'

